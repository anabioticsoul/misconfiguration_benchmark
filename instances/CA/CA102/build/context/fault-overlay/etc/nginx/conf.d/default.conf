server {
    listen [::]:80 ipv6only=off default_server;
    listen 80 default_server;
    server_name example.domain;
}

# IPv4 only endpoint
server {
    listen 80;
    server_name ipv4.example.domain;
}

# IPv6 only endpoint
server {
    listen [::]:80 ipv6only=on;
    server_name ipv6.example.domain;
}
