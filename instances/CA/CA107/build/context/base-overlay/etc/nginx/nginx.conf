worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;
events {
    worker_connections 64;
}
http {
    access_log off;
    limit_req_zone $http_CLIENT_KEY zone=newzone:10m rate=10r/m;
    server {
        listen 80;
        limit_req zone=newzone burst=9 nodelay;
        limit_req_status 429;
        location / {
            return 200 "ok\n";
        }
    }
}
