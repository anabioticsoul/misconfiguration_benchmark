<VirtualHost *:80>
    ServerName cd163.local
    DocumentRoot /var/www/html
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:9000/
    ProxyPassReverse / http://127.0.0.1:9000/
    ProxyErrorOverride Off
    ErrorDocument 500 "The page cannot be displayed because an internal server error has occurred."
    <Directory /var/www/html>
        Require all granted
    </Directory>
</VirtualHost>
