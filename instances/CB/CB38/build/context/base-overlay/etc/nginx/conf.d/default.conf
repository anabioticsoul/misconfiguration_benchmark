server {
    listen 80;
    server_name _;
    root /home/ubuntu/virtualenv/myapp/myapp/homelaunch/;

    location = /health {
        default_type text/plain;
        return 200 "healthy\n";
    }

    location /static/ {
        alias /home/ubuntu/virtualenv/myapp/myapp/homelaunch/static/;
    }

    location / {
        return 404;
    }
}
